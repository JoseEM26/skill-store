name: Release and Ingest Skills

on:
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - '.github/workflows/release-and-ingest.yml'

permissions:
  contents: write
  packages: write

jobs:
  release-and-ingest:
    name: Validate, Tag Release & Ingest to Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skill_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skill_store?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate SKILL.md frontmatter & SemVer
        run: pnpm test:skills

      - name: Run database migrations
        run: pnpm prisma db push

      - name: Ingest Skills to PostgreSQL
        run: pnpm db:ingest-skills

      - name: Create Git Tags for Published Skills
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const matter = require('gray-matter');

            const skillsDir = path.resolve('skills');
            const entries = fs.readdirSync(skillsDir, { withFileTypes: true });

            for (const entry of entries) {
              if (entry.isDirectory()) {
                const skillFile = path.join(skillsDir, entry.name, 'SKILL.md');
                if (fs.existsSync(skillFile)) {
                  const content = fs.readFileSync(skillFile, 'utf-8');
                  const { data } = matter(content);
                  if (data && data.name && data.version) {
                    const tagName = `${data.name}-v${data.version}`;
                    try {
                      await github.rest.git.createRef({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        ref: `refs/tags/${tagName}`,
                        sha: context.sha,
                      });
                      console.log(`Tag creado exitosamente: ${tagName}`);
                    } catch (err) {
                      console.log(`El tag ${tagName} ya existe o no pudo crearse: ${err.message}`);
                    }
                  }
                }
              }
            }
